<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title }} | {{ site.title | default: "Maths Notes" }}</title>
    <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">

    <script>
      MathJax = {
        tex: {
          inlineMath: [['\\(', '\\)'], ['$', '$']],
          displayMath: [['\\[', '\\]'], ['$$', '$$']]
        }
      };
    </script>
    <script defer src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
  </head>

  <body>
    <header>
      <a href="{{ '/' | relative_url }}">Maths Notes</a>
    </header>

    <main>
      <article>
        <h1>{{ page.title }}</h1>

        <p class="post-meta">
          {{ page.date | date: "%d %B %Y" }}
        </p>

        {% if page.tags.size > 0 %}
        <p class="post-tags">
          {% for tag in page.tags %}
            <span class="tag">{{ tag }}</span>
          {% endfor %}
        </p>
        {% endif %}

        {{ content }}
      </article>
    </main>
  </body>
</html>

---
layout: default
---

<article class="post">
  <h1>{{ page.title }}</h1>

  <p class="post-meta">
    {{ page.date | date: "%d %B %Y" }}
  </p>

  {% if page.tags.size > 0 %}
  <p class="post-tags">
    {% for tag in page.tags %}
      <span class="tag">{{ tag }}</span>
    {% endfor %}
  </p>
  {% endif %}

  <div class="post-content">
    {{ content }}
  </div>
</article>
